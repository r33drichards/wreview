name: wreview
on:
  pull_request_target:
    types: [labeled]

permissions: {}

concurrency:
  group: wreview-${{ github.event.pull_request.number }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.label.name == 'wreview'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: wasix-org/cargo-wasix@v0.1.34
        with:
          toolchain-version: v2026-09-18.1+rust-1.97
      - name: Install WASI SDK
        run: |
          curl --fail --silent --show-error --location https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/wasi-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "CC_wasm32_wasmer_wasi=$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux/bin/clang" >> "$GITHUB_ENV"
      - run: python3 scripts/build_wasix.py
      - uses: actions/upload-artifact@v4
        with:
          name: wreview-wasm
          path: dist/minimal-mcp-agent.wasm
          if-no-files-found: error

  review:
    needs: build
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wreview-wasm
          path: dist
      - name: Install Wasmer
        run: |
          curl --fail --silent --show-error --location https://get.wasmer.io -o "$RUNNER_TEMP/install-wasmer.sh"
          sh "$RUNNER_TEMP/install-wasmer.sh" v7.5.0
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
      - name: Start isolated mcp-js
        run: |
          docker run --detach --rm --name wreview-mcp -p 127.0.0.1:8091:8080 \
            wholelottahoopla/mcp-js:0.22.0@sha256:d08ea2be9efec96a613ae2ac480b1ff8dfe405e0b3a69b470b599ca1788f72be --http-port 8080 --heap-store dir --heap-dir /tmp/wreview-heaps
          curl --fail --silent --show-error --retry 15 --retry-connrefused http://127.0.0.1:8091/api/executions
      - name: Review labeled PR
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          CHATGPT_ACCESS_TOKEN: ${{ secrets.CHATGPT_ACCESS_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python3 review/run.py
