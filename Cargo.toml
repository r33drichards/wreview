[package]
name = "minimal-mcp-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small Rust agent loop with MCP tools and Sign in with ChatGPT"

[features]
default = []
mysql-backend = ["dep:mysql", "dep:rustls"]
wasmer-review = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:webpki-roots", "dep:rustls", "dep:hmac", "dep:flate2", "dep:tar", "dep:ring"]

[dependencies]
base64 = "0.22"
sha2 = "0.10"
mysql = { version = "26", optional = true, default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "form"] }
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tiny_http = "0.12"
postgres = { version = "0.19", optional = true }
tokio-postgres-rustls = { version = "0.13", default-features = false, optional = true }
webpki-roots = { version = "1", optional = true }
ring = { version = "0.17", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
hmac = { version = "0.12", optional = true }
jsonwebtoken = "9"

[target.'cfg(unix)'.dependencies]
rand = "0.8"
fs2 = "0.4"
