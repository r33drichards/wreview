[package]
name = "r33drichards/minimal-mcp-agent"
version = "0.1.0"
description = "Minimal Rust agent with MCP tools and an authenticated HTTP interface"
repository = "https://github.com/r33drichards/minimal-mcp-agent"
entrypoint = "minimal-mcp-agent"

[[module]]
name = "minimal-mcp-agent"
